<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Savills SRM · Profitability</title>
<link rel="stylesheet" href="design-system/colors_and_type.css">
<link rel="stylesheet" href="universal-fee-calc/styles.css">
<style>
  a{color:var(--sav-teal)}a:hover{color:var(--sav-navy)}
  .head .title-block h1 a{color:inherit;text-decoration:none}
  .controls{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;background:#fff;border:1px solid rgba(37,39,58,0.12);padding:14px 18px;margin-bottom:20px}
  .ctl{display:flex;flex-direction:column;gap:5px}
  .ctl label{font-family:var(--font-display);font-weight:700;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--sav-steel)}
  .ctl select,.ctl input{font-family:var(--font-body);font-size:13px;padding:7px 10px;border:1px solid rgba(37,39,58,0.22);background:#fff;color:var(--sav-navy)}
  .ctl.grow{flex:1}
  .ctl .chk{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-body);font-size:12.5px;color:var(--sav-navy);cursor:pointer;padding-bottom:6px}
  .kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .kpi-card{background:#fff;border:1px solid rgba(37,39,58,0.10);padding:15px 18px}
  .kpi-card .k-num{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;color:var(--sav-navy);font-variant-numeric:tabular-nums}
  .kpi-card .k-lbl{font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:var(--sav-steel);margin-top:8px}
  .kpi-card.warn .k-num{color:#C0392B}
  .kpi-card.accent .k-num{color:var(--sav-teal)}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input[type=search]{font-family:var(--font-body);font-size:13px;padding:8px 12px;border:1px solid rgba(37,39,58,0.22);min-width:230px}
  .toolbar select{font-family:var(--font-body);font-size:12.5px;padding:8px 10px;border:1px solid rgba(37,39,58,0.22);background:#fff;color:var(--sav-navy)}
  .grow{flex:1}
  .note-txt{font-size:11.5px;color:var(--sav-steel)}
  table.dt{border-collapse:collapse;width:100%;background:#fff;font-size:12.5px}
  table.dt thead th{font-family:var(--font-display);font-size:9.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--sav-steel);text-align:left;padding:9px 10px;background:#faf9f7;border-bottom:1px solid rgba(37,39,58,0.14);position:sticky;top:0;z-index:2;white-space:nowrap}
  table.dt td{padding:8px 10px;border-top:1px solid rgba(37,39,58,0.07);vertical-align:top;color:var(--sav-navy)}
  table.dt tbody tr:hover td{background:#fbf8ee}
  table.dt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.dt thead th.num{text-align:right}
  .pname{font-family:var(--font-display);font-weight:600;font-size:12.5px}
  .vmini{font-size:10px;color:var(--sav-steel)}
  .var-over{color:#C0392B;font-weight:700}
  .var-ok{color:#1f7a44;font-weight:700}
  .badge{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:9px;letter-spacing:0.04em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:#eceff1;color:var(--sav-steel)}
  .badge.active{background:#dcefe9;color:#116149}
  .badge.pursuit{background:#fdf3c7;color:#8a6d00}
  .mv-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:#f0efec;padding:3px 9px;border-radius:2px;color:var(--sav-navy)}
  .cmp-scroll{overflow-x:auto;border:1px solid rgba(37,39,58,0.12);background:#fff}
  .cmp-scroll table.dt{min-width:100%}
  .sticky-col{position:sticky;left:0;background:#fff;z-index:1;min-width:230px;box-shadow:1px 0 0 rgba(37,39,58,0.1)}
  table.dt thead th.sticky-col{z-index:3;background:#faf9f7}
  .empty{background:#fff;border:1px dashed rgba(37,39,58,0.25);padding:40px;text-align:center;color:var(--sav-steel);font-size:13px}
  .fee-link-sel{font-family:var(--font-body);font-size:11px;padding:3px 6px;border:1px solid rgba(37,39,58,0.2);background:#fff;color:var(--sav-navy);max-width:220px}
  .btn{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;padding:9px 16px;border:2px solid var(--sav-navy);cursor:pointer;background:var(--sav-navy);color:#fff}
  .btn:hover{background:var(--sav-teal);border-color:var(--sav-teal)}
  .btn-ghost{background:transparent;color:var(--sav-navy)}
  .btn-ghost:hover{background:var(--sav-navy);color:#fff}
  .btn:disabled{opacity:0.5;cursor:default}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sav-navy);color:#fff;font-size:13px;padding:11px 22px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:1000;box-shadow:0 6px 24px rgba(37,39,58,.35)}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <img class="logo" src="design-system/assets/savills_logo.png" alt="Savills">
    <div class="title-block">
      <h1>Profitability</h1>
      <p class="tagline">The revenue projection with Paylocity burn (hours × cost rate) laid against it, month by month — margin per project, per month.</p>
    </div>
  </header>

  <div class="identity-bar">
    <span class="id-label">Viewing as</span>
    <select id="id-user"></select>
    <span class="id-role" id="id-role"></span>
    <span class="id-note" id="id-note"></span>
  </div>

  <div class="controls">
    <div class="ctl">
      <label>Window start</label>
      <div style="display:flex;gap:4px;align-items:stretch">
        <button class="btn btn-ghost" id="win-prev" title="Previous month" style="padding:4px 10px;border-width:1px">◀</button>
        <select id="win-start"></select>
        <button class="btn btn-ghost" id="win-next" title="Next month" style="padding:4px 10px;border-width:1px">▶</button>
      </div>
    </div>
    <div class="ctl">
      <label>Months</label>
      <select id="win-len">
        <option value="3">3</option>
        <option value="6">6</option>
        <option value="12" selected>12</option>
        <option value="18">18</option>
        <option value="24">24</option>
      </select>
    </div>
    <div class="ctl">
      <label>&nbsp;</label>
      <label class="chk"><input type="checkbox" id="show-map"> Show mapping tools on rows</label>
    </div>
    <div class="ctl grow"></div>
    <div class="ctl" style="align-self:center"><span class="note-txt" id="store-note"></span></div>
  </div>

  <section id="p-profit"></section>
</div>
<div id="toast"></div>

<script src="universal-fee-calc/rates-catalog.js?v=20260723g"></script>
<script src="universal-fee-calc/store.js?v=20260723g"></script>
<script src="universal-fee-calc/box-adapter.js?v=20260723g"></script>
<script src="universal-fee-calc/boot.js?v=20260723g"></script>
<script src="universal-fee-calc/sync-status.js?v=20260723g"></script>
<script src="universal-fee-calc/staff-seed.js?v=20260723g"></script>
<script src="universal-fee-calc/staff.js?v=20260723g"></script>
<script src="universal-fee-calc/nav.js?v=20260723g"></script>
<script src="universal-fee-calc/profitability-page.js?v=20260723g"></script>
</body>
</html>
